<svg width="100%" height="24" viewBox="0 0 1000 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cosmicLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7b2cbf" stop-opacity="0" />
      <stop offset="20%" stop-color="#7b2cbf" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#c77dff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#00f5d4" stop-opacity="1" />
      <stop offset="60%" stop-color="#c77dff" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#7b2cbf" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7b2cbf" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Glowing background line -->
  <line x1="50" y1="12" x2="950" y2="12" stroke="url(#cosmicLine)" stroke-width="3" filter="url(#glow)" stroke-linecap="round" />
  <line x1="50" y1="12" x2="950" y2="12" stroke="url(#cosmicLine)" stroke-width="1.2" stroke-linecap="round" />

  <!-- Center Celestial Star/Moon -->
  <g transform="translate(500, 12)">
    <circle r="6" fill="#0b051d" stroke="#00f5d4" stroke-width="1.5" filter="url(#glow)" />
    <!-- 4-point star -->
    <path d="M 0 -4 Q 0 0 4 0 Q 0 0 0 4 Q 0 0 -4 0 Q 0 0 0 -4 Z" fill="#e0aaff" />
  </g>

  <!-- Flanking micro-stars -->
  <circle cx="430" cy="12" r="1.5" fill="#e0aaff" opacity="0.8" />
  <circle cx="570" cy="12" r="1.5" fill="#e0aaff" opacity="0.8" />
  <circle cx="360" cy="12" r="1" fill="#c77dff" opacity="0.6" />
  <circle cx="640" cy="12" r="1" fill="#c77dff" opacity="0.6" />
  <circle cx="280" cy="12" r="1.2" fill="#00f5d4" opacity="0.7" />
  <circle cx="720" cy="12" r="1.2" fill="#00f5d4" opacity="0.7" />
</svg>
